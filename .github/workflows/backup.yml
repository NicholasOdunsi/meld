name: Backup

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with: { version: 2.109.1 }
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Dump and encrypt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          RECIPIENT: ${{ secrets.ORION_BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          mkdir -p work && cd work
          # supabase link needs a project; init if outside checkout
          if [ ! -f supabase/config.toml ]; then supabase init --force >/dev/null; fi
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --password "$SUPABASE_DB_PASSWORD" >/dev/null
          supabase db dump --password "$SUPABASE_DB_PASSWORD" -f schema.sql >/dev/null
          supabase db dump --password "$SUPABASE_DB_PASSWORD" --data-only --schema public,auth -f data.sql >/dev/null
          tar -czf - schema.sql data.sql | age -r "$RECIPIENT" > ../orion-backup.tar.gz.age
          cd .. && rm -rf work
          ls -l orion-backup.tar.gz.age
      - uses: actions/upload-artifact@v4
        with:
          name: orion-backup-${{ github.run_id }}
          path: orion-backup.tar.gz.age
          retention-days: 30
