name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # move the `deployed` tag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.2", cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Migration guard
        run: |
          if git rev-parse -q --verify refs/tags/deployed >/dev/null; then
            files=$(git diff --name-only --diff-filter=AM deployed HEAD -- supabase/migrations/)
            if [ -n "$files" ]; then node scripts/orion-online/migration-guard.mjs $files; fi
          else
            echo "First deploy: hosted database is empty, guard skipped."
          fi

      - uses: supabase/setup-cli@v1
        with: { version: 2.109.1 }
      - name: Database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @meld/gateway-worker run deploy

      - name: Website
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          pnpm dlx vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          pnpm dlx vercel@latest build --prod --token "$VERCEL_TOKEN"
          pnpm dlx vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      - name: Smoke check
        run: |
          curl -fsS -o /dev/null "${{ secrets.ORION_PROD_APP_URL }}/"
          curl -fsS "${{ secrets.ORION_PROD_GATEWAY_URL }}/health" | grep -q '"ok"'

      - name: Mark deployed
        run: |
          git tag -f deployed
          git push -f origin refs/tags/deployed
